<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCT | Preparando o sistema…</title>
<style>
  :root { --navy:#15232e; --navy2:#142336; --coral:#ed7961; --fg:#eef1f4; --mut:#b4c0ca; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--navy2); color:var(--fg); font:16px/1.55 Arial, Helvetica, sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  body::before { content:""; position:fixed; right:-8vw; top:0; bottom:0; width:46vw; background:var(--coral); opacity:.12; clip-path:polygon(42% 0,100% 0,100% 100%,0 100%); pointer-events:none; }
  header { background:var(--navy); padding:14px 24px; }
  header img { height:52px; display:block; margin:0 auto; max-width:100%; width:auto; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; }
  .box { max-width:520px; width:100%; text-align:center; }
  .loader { width:84px; height:84px; margin:0 auto 26px; position:relative; }
  .loader i { position:absolute; inset:0; border-radius:50%; border:4px solid rgba(237,121,97,.22); }
  .loader i + i { border-color:transparent; border-top-color:var(--coral); animation:spin 1.1s linear infinite; }
  .loader svg { position:absolute; inset:24px; width:36px; height:36px; color:var(--coral); animation:nudge 1.6s ease-in-out infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes nudge { 0%,100% { transform:translate(-3px,3px); } 50% { transform:translate(3px,-3px); } }
  h1 { font-size:26px; font-weight:400; margin:0 0 10px; }
  p { margin:0 0 8px; color:var(--mut); }
  .bar { height:6px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; margin:22px auto 10px; max-width:360px; }
  .bar b { display:block; height:100%; width:38%; border-radius:99px; background:var(--coral); animation:slide 1.5s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-40%; } 100% { margin-left:102%; } }
  .time { font-size:13px; color:var(--mut); }
  .slow { display:none; margin-top:18px; }
  .slow button, .slow a { cursor:pointer; background:var(--coral); color:var(--navy); border:0; border-radius:8px; padding:10px 18px; font:700 15px Arial, sans-serif; text-decoration:none; display:inline-block; }
  footer { text-align:center; color:#8797a5; font-size:12px; padding:0 16px 20px; position:relative; }
  @media (prefers-reduced-motion: reduce) { .loader i + i, .loader svg, .bar b { animation-duration:6s; } }
</style>
</head>

<script>
  // Endereço do sistema (Render). Altere aqui se usar outro domínio.
  const APP_URL = 'https://xml-fiscal.onrender.com';
  const inicio = Date.now();
  const $ = id => document.getElementById(id);
  let pronto = false;

  setInterval(() => {
    const s = Math.floor((Date.now() - inicio) / 1000);
    $('tempo').textContent = 'Aguardando há ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (s > 120) $('lento').style.display = 'block';
  }, 1000);

  async function verificar() {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    try {
      const r = await fetch(APP_URL + '/ping?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
      const j = await r.json();
      return !!(j && j.ok);
    } catch (e) { return false; }
    finally { clearTimeout(t); }
  }

  (async function loop() {
    while (!pronto) {
      if (await verificar()) {
        pronto = true;
        $('titulo').textContent = 'Sistema pronto!';
        $('texto').textContent = 'Redirecionando…';
        setTimeout(() => location.replace(APP_URL), 400);
        return;
      }
      await new Promise(r => setTimeout(r, 3000));
    }
  })();
</script>
